<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101528"><title>SJ Restaurant</title>
<style>
:root{--bg:#0e1426;--panel:#182238;--line:#2b3855;--text:#f4f6ff;--muted:#aab4ca;--purple:#7047ef;--green:#0fa985;--orange:#ef941f;--red:#e64b78}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}.accent{height:7px;background:linear-gradient(90deg,#6338e8,#a35dff,#2457e8)}
#loginScreen{min-height:calc(100vh - 7px);display:flex;align-items:center;justify-content:center;padding:28px 18px;background:radial-gradient(circle at 50% 12%,rgba(111,67,239,.2),transparent 34%),var(--bg)}.login-wrap{width:min(100%,520px);text-align:center}.brand{width:100px;height:100px;margin:0 auto 22px;border-radius:28px;display:grid;place-content:center;background:linear-gradient(145deg,#fff,#dfe4ff);border:3px solid #8055ff;box-shadow:0 0 30px #7047ef55;color:#5c35d8;font-size:34px;font-weight:950;letter-spacing:-3px}.brand small{display:block;font-size:9px;letter-spacing:1px;color:#27304b;margin-top:-4px}.login-wrap h1{font-size:clamp(28px,7vw,40px);margin:0;font-weight:850}.sub{color:var(--muted);margin:9px 0 30px}.login-card{background:#182238f2;border:1px solid var(--line);border-radius:30px;padding:28px 24px;box-shadow:0 16px 38px #0004;text-align:left}.label{display:block;color:#d7deef;font-size:14px;font-weight:750;margin:0 0 10px}.field{width:100%;height:62px;background:#111b30;border:1px solid #34415e;border-radius:17px;color:#fff;padding:0 18px;outline:none;font-size:16px;margin-bottom:22px}.field:focus{border-color:#8d62ff;box-shadow:0 0 0 3px #7047ef26}.field::placeholder{color:#8d98b0}.primary{width:100%;border:0;border-radius:17px;min-height:62px;color:#fff;font-size:18px;font-weight:850;background:linear-gradient(110deg,#6841e8,#5634d8);box-shadow:0 10px 24px #5d39dc3d}.note{text-align:center;color:#8995ae;font-size:12px;margin:17px 0 0}
#mainScreen{min-height:100vh}.topbar{height:76px;position:sticky;top:0;z-index:20;background:#172136f5;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 18px;backdrop-filter:blur(16px)}.icon{width:46px;height:46px;border:0;border-radius:15px;background:#111b30;color:#dce3f5;font-size:22px;display:grid;place-items:center}.mini{width:43px;height:43px;border-radius:13px;background:linear-gradient(145deg,#fff,#dfe4ff);color:#5e38d8;display:grid;place-items:center;font-weight:950;border:2px solid #7650f0}.topname{font-size:19px;font-weight:850;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.logout{color:#ff789a;background:#e64b781f}.layout{display:flex;min-height:calc(100vh - 76px)}.sidebar{width:258px;flex-shrink:0;background:#151f34;border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:76px;height:calc(100vh - 76px);overflow:auto}.sidehead{font-size:11px;letter-spacing:2px;color:#7f8ba6;font-weight:850;padding:12px 13px 8px}.navlink{width:100%;border:0;background:transparent;color:#b9c3d8;display:flex;align-items:center;gap:14px;padding:14px 13px;border-radius:15px;text-align:left;font-weight:700;margin:3px 0}.navicon{width:32px;height:32px;border-radius:11px;background:#202c48;display:grid;place-items:center;color:#a98cff;font-size:17px}.navlink.active{background:linear-gradient(100deg,#7047ef3d,#7047ef14);color:#fff}.navlink.active .navicon{background:#4d36a8;color:#fff}.content{flex:1;min-width:0;padding:28px 24px 110px;max-width:1400px;margin:auto;width:100%}.welcome{background:linear-gradient(115deg,#5e35d9,#8655f2);border-radius:30px;padding:26px 28px;min-height:150px;display:flex;align-items:center;justify-content:space-between;position:relative;overflow:hidden;box-shadow:0 14px 34px #5533d033}.welcome:after{content:"";position:absolute;width:200px;height:200px;border-radius:50%;background:#ffffff12;right:-25px;bottom:-140px}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:850;opacity:.8}.welcome h2{font-size:30px;margin:8px 0 5px}.welcome p{margin:0;color:#e0d8ff}.welcomeicon{width:70px;height:70px;border-radius:23px;background:#ffffff26;display:grid;place-items:center;font-size:30px;z-index:1}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:22px 0}.stat{border-radius:23px;padding:21px 20px;min-height:142px;box-shadow:0 16px 38px #0003}.stat:nth-child(1){background:linear-gradient(145deg,#0c9c80,#087e78)}.stat:nth-child(2){background:linear-gradient(145deg,#6540e3,#4d35c6)}.stat:nth-child(3){background:linear-gradient(145deg,#e99a24,#d97712)}.stat:nth-child(4){background:linear-gradient(145deg,#e34b82,#c62c68)}.statlabel{font-size:12px;letter-spacing:1.3px;font-weight:850}.statvalue{font-size:31px;font-weight:900;margin:12px 0 5px}.statfoot{font-size:12px;opacity:.82}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:30px 2px 15px}.sectionhead h3{font-size:21px;margin:0}.sectionhead span{font-size:11px;letter-spacing:1.6px;color:#8490aa;font-weight:850}.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.action{background:var(--panel);border:1px solid var(--line);border-radius:22px;min-height:132px;padding:18px 10px;color:#f2f4ff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-weight:800;box-shadow:0 16px 38px #0003}.actionicon{width:54px;height:54px;border-radius:18px;background:#292451;color:#a78bff;display:grid;place-items:center;font-size:24px}.action:nth-child(2) .actionicon{background:#183e4a;color:#38d4bd}.action:nth-child(3) .actionicon{background:#4a351d;color:#ffb84c}.action:nth-child(4) .actionicon{background:#47243c;color:#ff83b1}.placeholder{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:24px;color:var(--muted);min-height:190px}.placeholder strong{color:#fff;display:block;font-size:20px;margin-bottom:9px}.page-title{font-size:28px;font-weight:900;margin:4px 0 22px}.bottom{display:none}.overlay{position:fixed;inset:0;background:#0009;z-index:40}.drawer{position:fixed;z-index:41;left:0;top:0;bottom:0;width:min(82vw,330px);background:#151f34;border-right:1px solid var(--line);padding:22px 15px;overflow:auto;transform:translateX(-105%);transition:transform .22s}.drawer.open{transform:translateX(0)}.drawerhead{display:flex;justify-content:space-between;align-items:center;padding:4px 8px 20px;font-size:19px;font-weight:900;border-bottom:1px solid var(--line);margin-bottom:14px}.toast{position:fixed;z-index:60;bottom:92px;left:50%;transform:translateX(-50%);background:#25334f;color:white;border:1px solid #465779;border-radius:14px;padding:13px 18px;box-shadow:0 16px 38px #0005;font-size:14px;max-width:90%;text-align:center}
@media(max-width:900px){.sidebar{display:none}.content{padding:22px 18px 110px}.bottom{display:flex;position:fixed;z-index:25;bottom:0;left:0;right:0;height:76px;padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:#172136fa;border-top:1px solid var(--line);justify-content:space-around}.bottom button{border:0;background:transparent;color:#9ca8c0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;flex:1;font-size:11px;font-weight:800}.bottom b{font-size:22px}.bottom button.active{color:#a58aff}}
@media(max-width:600px){.topbar{height:68px;padding:0 12px;gap:9px}.topbar .icon{width:42px;height:42px}.mini{width:39px;height:39px}.topname{font-size:17px}.layout{min-height:calc(100vh - 68px)}.content{padding:18px 14px 105px}.welcome{padding:22px 20px;min-height:140px;border-radius:25px}.welcome h2{font-size:26px}.welcomeicon{width:58px;height:58px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin:16px 0}.stat{min-height:126px;padding:17px 15px;border-radius:20px}.statvalue{font-size:27px;margin:10px 0 4px}.actions{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.action{min-height:122px}.page-title{font-size:25px}.login-card{padding:24px 19px}}
</style>
</head>
<body>
<div class="accent"></div>
<section id="loginScreen"><div class="login-wrap">
  <div class="brand">SJ<small>DIGITAL LABS</small></div><h1>SJ Restaurant</h1><p class="sub">Login to manage your restaurant</p>
  <form class="login-card" id="loginForm">
    <label class="label" for="restaurantName">Restaurant Name</label><input class="field" id="restaurantName" placeholder="Enter your restaurant name" autocomplete="organization" required>
    <label class="label" for="pin">PIN / Password</label><input class="field" id="pin" type="password" minlength="4" placeholder="Enter PIN or password" required>
    <button class="primary" type="submit">Login&nbsp; →</button><p class="note">Demo interface · Backend authentication not connected</p>
  </form>
</div></section>
<section id="mainScreen" class="hidden">
<header class="topbar"><button class="icon" id="menuBtn">☰</button><div class="mini">SJ</div><div class="topname" id="topName">My Restaurant</div><button class="icon" id="themeBtn">☾</button><button class="icon logout" id="logoutBtn">⇥</button></header>
<div class="layout"><aside class="sidebar" id="desktopNav"></aside><main class="content"><div id="pageContent"></div></main></div>
<nav class="bottom" id="bottomNav"><button class="active" data-page="dashboard"><b>⌂</b>Home</button><button data-page="orders"><b>▤</b>Orders</button><button data-page="tables"><b>▦</b>Tables</button><button data-page="menu"><b>☷</b>Menu</button></nav>
</section>
<div class="overlay hidden" id="overlay"></div><aside class="drawer" id="drawer"><div class="drawerhead"><span>SJ Restaurant</span><button class="icon" id="closeDrawer">×</button></div><div id="drawerNav"></div></aside><div class="toast hidden" id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const pages={dashboard:{label:"Dashboard",icon:"⌂"},orders:{label:"Orders",icon:"▤"},tables:{label:"Tables",icon:"▦"},menu:{label:"Menu Management",icon:"☷"},kitchen:{label:"Kitchen Display",icon:"♨"},staff:{label:"Staff Management",icon:"♙"},reports:{label:"Reports",icon:"▥"}};
let current="dashboard",restaurant="";
function navHTML(){return [{title:"OVERVIEW",items:["dashboard","orders","tables"]},{title:"MANAGEMENT",items:["menu","kitchen","staff"]},{title:"BUSINESS",items:["reports"]}].map(g=>`<div class="sidehead">${g.title}</div>`+g.items.map(k=>`<button class="navlink ${current===k?"active":""}" data-page="${k}"><span class="navicon">${pages[k].icon}</span>${pages[k].label}</button>`).join("")).join("")}
function renderNav(){$("desktopNav").innerHTML=navHTML();$("drawerNav").innerHTML=navHTML();document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{showPage(b.dataset.page);closeDrawer()});document.querySelectorAll("#bottomNav button").forEach(b=>b.classList.toggle("active",b.dataset.page===current))}
function dashboard(){return `<section class="welcome"><div><div class="eyebrow">RESTAURANT OVERVIEW</div><h2>Welcome back!</h2><p>Here is your restaurant summary.</p></div><div class="welcomeicon">🍽️</div></section>
<div class="stats"><article class="stat"><div class="statlabel">TODAY'S SALES</div><div class="statvalue">₹0</div><div class="statfoot">Today's total revenue</div></article><article class="stat"><div class="statlabel">TODAY'S PROFIT</div><div class="statvalue">₹0</div><div class="statfoot">Estimated earnings</div></article><article class="stat"><div class="statlabel">ACTIVE ORDERS</div><div class="statvalue">0</div><div class="statfoot">Orders in progress</div></article><article class="stat"><div class="statlabel">AVAILABLE TABLES</div><div class="statvalue">0</div><div class="statfoot">Tables ready to use</div></article></div>
<div class="sectionhead"><h3>Quick Actions</h3><span>SHORTCUTS</span></div><div class="actions"><button class="action" data-page="orders"><span class="actionicon">＋</span>New Order</button><button class="action" data-page="tables"><span class="actionicon">▦</span>Manage Tables</button><button class="action" data-page="menu"><span class="actionicon">☷</span>Manage Menu</button><button class="action" data-page="reports"><span class="actionicon">▥</span>View Reports</button></div>
<div class="sectionhead"><h3>Recent Activity</h3><span>LIVE SUMMARY</span></div><div class="placeholder"><strong>👋 Your restaurant is ready</strong>No orders yet. New orders and activity will appear here when the backend is connected.</div>`}
const descriptions={orders:["Order Management","Create and track dine-in, takeaway and delivery orders. Order processing will be connected in the next development step."],tables:["Table Management","View restaurant tables, occupancy and table status. Table configuration will be added in the next development step."],menu:["Menu Management","Add food items, categories, prices and availability. Menu data is currently demo-only."],kitchen:["Kitchen Display","View accepted orders and update preparation status. Live kitchen updates require backend integration."],staff:["Staff Management","Manage staff roles, PINs and access. Secure staff accounts require backend authentication."],reports:["Reports & Analytics","Review sales, orders and performance. Real reports require saved transaction data."]};
function showPage(k){if(!pages[k])return;current=k;$("pageContent").innerHTML=k==="dashboard"?dashboard():`<h1 class="page-title">${pages[k].icon} ${descriptions[k][0]}</h1><div class="placeholder"><strong>${descriptions[k][0]}</strong>${descriptions[k][1]}<br><br><span style="color:#9b86ff">UI section ready for the next development step.</span></div>`;renderNav();document.querySelectorAll("#pageContent [data-page]").forEach(b=>b.onclick=()=>showPage(b.dataset.page))}
function openDrawer(){$("drawer").classList.add("open");$("overlay").classList.remove("hidden")}function closeDrawer(){$("drawer").classList.remove("open");$("overlay").classList.add("hidden")}
let timer;function toast(msg){$("toast").textContent=msg;$("toast").classList.remove("hidden");clearTimeout(timer);timer=setTimeout(()=>$("toast").classList.add("hidden"),2600)}
$("loginForm").addEventListener("submit",e=>{e.preventDefault();const n=$("restaurantName").value.trim(),p=$("pin").value.trim();if(!n||p.length<4){toast("Enter restaurant name and a PIN of at least 4 characters.");return}restaurant=n;$("topName").textContent=n;$("loginScreen").classList.add("hidden");$("mainScreen").classList.remove("hidden");showPage("dashboard")});
$("logoutBtn").onclick=()=>{$("mainScreen").classList.add("hidden");$("loginScreen").classList.remove("hidden");$("pin").value="";current="dashboard"};
$("menuBtn").onclick=openDrawer;$("closeDrawer").onclick=closeDrawer;$("overlay").onclick=closeDrawer;$("themeBtn").onclick=()=>toast("Dark theme is active.");
</script>
</body></html>
