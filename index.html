  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <body class="bg-stone-50 text-stone-900 min-h-screen">

      <div class="min-h-screen flex items-center justify-center">
        <div class="text-center p-6 space-y-3">
          <div class="w-8 h-8 border-3 border-amber-600 border-t-transparent rounded-full animate-spin mx-auto"></div>
          <p class="text-sm font-semibold text-stone-700">Connecting to MyQRMenu...</p>

    <!-- Complete Self-Contained App (React, Firebase Firestore, UI Components) -->
    <script type="module">
import { createRoot } from "react-dom/client";
import React, { useState, useEffect, useMemo } from "react";

// Firebase CDN Initialization
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {
  getFirestore,
  collection,
  doc,
  getDocs,
  addDoc,
  updateDoc,
  deleteDoc,
  onSnapshot,
  query,
  orderBy,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

var firebaseConfig = {
  apiKey: "AIzaSyDL_AyEqLAZ7mafIN3J5AMV2n3uShEeW8",
  authDomain: "menu-qr-b8765.firebaseapp.com",
  projectId: "menu-qr-b8765",
  storageBucket: "menu-qr-b8765.firebasestorage.app",
  messagingSenderId: "71280897038",
  appId: "1:71280897038:web:180294fd94d32e6f11205f",
  measurementId: "G-TNKM262EVG"
};

var app = null;
var db = null;
var isFirebaseAvailable = false;
try {
  app = !getApps().length ? initializeApp(firebaseConfig) : getApp();
  db = getFirestore(app);
  isFirebaseAvailable = true;
  console.log("✅ Firebase Firestore initialized successfully");
} catch (err) {
  console.warn("⚠️ Firebase init warning - running in resilient offline fallback mode:", err);
  isFirebaseAvailable = false;
}

// ==========================================
// 1. DEFAULT RESTAURANTS (Default ID: 'rest-101')
// ==========================================
const DEFAULT_RESTAURANTS = [
  {
    id: "rest-101",
    name: "Sagar's Cafe",
    tagline: "Fresh Brews, Delicious Bites & More",
    ownerPin: "111111",
    kitchenPin: "222222",
    subscriptionStatus: "ACTIVE",
    dueDate: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString().split("T")[0],
    isKitchenOpen: true,
  },
  {
    id: "rest-102",
    name: "Spice Craft Bistro",
    tagline: "Modern Indian Fusion & Tandoor Grill",
    ownerPin: "333333",
    kitchenPin: "444444",
    subscriptionStatus: "EXPIRED",
    dueDate: new Date(Date.now() - 3 * 24 * 60 * 60 * 1000).toISOString().split("T")[0],
    isKitchenOpen: true,
  }
];

function getDaysRemaining(dueDateStr) {
  if (!dueDateStr) return 0;
  const due = new Date(dueDateStr);
  const now = new Date();
  const diffTime = due.getTime() - now.getTime();
  return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
}

// ==========================================
// 2. MAIN APP ROOT ROUTER
// ==========================================
export default function App() {
  const queryParams = new URLSearchParams(window.location.search);
  const urlRestId = queryParams.get("restId") || queryParams.get("restaurantId") || "rest-101";
  const urlTable = parseInt(queryParams.get("table") || "5", 10);

  const isStaffInitial = 
    window.location.pathname.toLowerCase().replace(/\/+$/, "").endsWith("/staff") ||
    queryParams.get("staff") === "true" ||
    queryParams.get("view") === "staff";

  const [currentRestId, setCurrentRestId] = useState(urlRestId);
  const [currentTable, setCurrentTable] = useState(urlTable);
  const [restaurants, setRestaurants] = useState(DEFAULT_RESTAURANTS);
  const [currentView, setCurrentView] = useState(isStaffInitial ? "login" : "customer");
  const [userSession, setUserSession] = useState(null);

  useEffect(() => {
    const checkStaffRoute = () => {
      const sp = new URLSearchParams(window.location.search);
      const isStaff =
        window.location.pathname.toLowerCase().replace(/\/+$/, "").endsWith("/staff") ||
        sp.get("staff") === "true" ||
        sp.get("view") === "staff";
      if (isStaff) {
        setCurrentView("login");
      }
    };
    checkStaffRoute();
    window.addEventListener("popstate", checkStaffRoute);
    return () => window.removeEventListener("popstate", checkStaffRoute);
  }, []);

  useEffect(() => {
    if (!isFirebaseAvailable || !db) return;
    try {
      const unsub = onSnapshot(
        collection(db, "restaurants"),
        (snapshot) => {
          if (!snapshot.empty) {
            const firestoreList = snapshot.docs.map((docSnap) => ({
              id: docSnap.id,
              ...docSnap.data(),
            }));
            setRestaurants((prev) => {
              const map = new Map();
              DEFAULT_RESTAURANTS.forEach((r) => map.set(r.id, r));
              prev.forEach((r) => map.set(r.id, r));
              firestoreList.forEach((r) => map.set(r.id, { ...map.get(r.id), ...r }));
              return Array.from(map.values());
            });
          }
        },
        (err) => {
          console.warn("[App] Firestore restaurants listener note:", err);
        }
      );
      return () => unsub();
    } catch (err) {
      console.warn("[App] Exception setting up restaurants listener:", err);
    }
  }, []);

  const handleAddRestaurant = (newRest) => {
    setRestaurants((prev) => {
      const exists = prev.some(
        (r) => r.id === newRest.id || (r.name && newRest.name && r.name.toLowerCase() === newRest.name.toLowerCase())
      );
      if (exists) {
        return prev.map((r) => (r.id === newRest.id ? { ...r, ...newRest } : r));
      }
      return [newRest, ...prev];
    });
  };

  const handleReturnToCustomer = () => {
    if (
      window.location.pathname.toLowerCase().includes("/staff") ||
      window.location.search.includes("view=staff") ||
      window.location.search.includes("staff=true")
    ) {
      window.history.pushState({}, "", `/?restId=${currentRestId}&table=${currentTable}`);
    }
    setCurrentView("customer");
  };

  const currentRestaurant = useMemo(() => {
    return restaurants.find((r) => r.id === currentRestId) || {
      id: currentRestId,
      name: "Restaurant " + currentRestId,
      tagline: "Live Dining & QR Ordering",
      ownerPin: "111111",
      kitchenPin: "222222",
      subscriptionStatus: "ACTIVE",
      dueDate: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString().split("T")[0],
      isKitchenOpen: true,
    };
  }, [restaurants, currentRestId]);

  const handleRenewSubscription = async (restId) => {
    const currentRest = restaurants.find((r) => r.id === restId);
    const currentDue = currentRest?.dueDate ? new Date(currentRest.dueDate) : new Date();
    const baseDate = currentDue > new Date() ? currentDue : new Date();
    const newDueDate = new Date(baseDate.getTime() + 30 * 24 * 60 * 60 * 1000)
      .toISOString()
      .split("T")[0];

    setRestaurants((prev) =>
      prev.map((r) => {
        if (r.id === restId) {
          return {
            ...r,
            subscriptionStatus: "ACTIVE",
            dueDate: newDueDate,
          };
        }
        return r;
      })
    );

    if (isFirebaseAvailable && db) {
      try {
        await updateDoc(doc(db, "restaurants", restId), {
          subscriptionStatus: "ACTIVE",
          dueDate: newDueDate,
        });
      } catch (e) {
        console.warn("Could not update subscription in Firestore:", e);
      }
    }
  };

  return React.createElement(
    "div",
    { className: "min-h-screen bg-stone-50 text-stone-900 font-sans antialiased selection:bg-amber-100 selection:text-amber-900" },
    currentView === "customer" &&
      React.createElement(CustomerView, {
        restaurant: currentRestaurant,
        tableNumber: currentTable,
        onStaffLogin: () => setCurrentView("login")
      }),
    currentView === "login" &&
      React.createElement(PinLoginModal, {
        restaurants,
        defaultRestId: currentRestId,
        onSuccess: (session) => {
          setUserSession(session);
          if (session.role === "admin") setCurrentView("admin");
          else if (session.role === "owner") {
            setCurrentRestId(session.restaurantId);
            setCurrentView("owner");
          } else if (session.role === "kitchen") {
            setCurrentRestId(session.restaurantId);
            setCurrentView("kitchen");
          }
        },
        onCancel: handleReturnToCustomer,
      }),
    currentView === "owner" &&
      React.createElement(OwnerDashboard, {
        restaurant: currentRestaurant,
        onLogout: handleReturnToCustomer,
      }),
    currentView === "kitchen" &&
      React.createElement(KitchenDashboard, {
        restaurant: currentRestaurant,
        onLogout: handleReturnToCustomer,
      }),
    currentView === "admin" &&
      React.createElement(SuperAdminDashboard, {
        restaurants,
        onRenew: handleRenewSubscription,
        onAddRestaurant: handleAddRestaurant,
        onLogout: handleReturnToCustomer,
        setRestaurants: setRestaurants
      })
  );
}

// ==========================================
// 3. CUSTOMER VIEW & DIGITAL MENU
// ==========================================
function CustomerView({ restaurant, tableNumber, onStaffLogin }) {
  const searchParams = new URLSearchParams(window.location.search);
  const restaurantId = searchParams.get("restId") || searchParams.get("restaurantId") || (restaurant && restaurant.id) || "rest-101";

  const [menuItems, setMenuItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [fetchError, setFetchError] = useState(null);
  const [cart, setCart] = useState([]);
  const [selectedCategory, setSelectedCategory] = useState("All");
  const [searchQuery, setSearchQuery] = useState("");
  const [isCartOpen, setIsCartOpen] = useState(false);
  const [placedOrder, setPlacedOrder] = useState(null);
  const [isOrderSubmitting, setIsOrderSubmitting] = useState(false);
  const [specialInstructions, setSpecialInstructions] = useState("");
  const [showSuccessModal, setShowSuccessModal] = useState(false);

  // Live active order tracking state
  const [activeOrderId, setActiveOrderId] = useState(null);
  const [liveOrderStatus, setLiveOrderStatus] = useState(null);

  const mapDocToItem = (id, data) => ({
    id: id || data.id,
    name: data.name || data.title || "Untitled Dish",
    description: data.description || data.desc || "",
    price: typeof data.price === "number" ? data.price : parseFloat(data.price) || 0,
    category: data.category || "Mains",
    imageUrl: data.image || data.imageUrl || "https://images.unsplash.com/photo-1546833999-b9f581a1996d?auto=format&fit=crop&w=600&q=80",
    isVegetarian: data.type === "veg" || Boolean(data.isVegetarian),
    isSpicy: Boolean(data.isSpicy),
    tag: data.isSpecial ? "Special" : data.tag || data.seasonalTag || null,
    prepTime: data.prepTime || "15 mins",
    available: data.available !== false,
  });

  useEffect(() => {
    let unsubscribe = () => {};
    let isMounted = true;
    let hasReceivedInitialSnapshot = false;
    setLoading(true);
    setFetchError(null);

    const fetchViaRest = async () => {
      try {
        const res = await fetch(`https://firestore.googleapis.com/v1/projects/menu-qr-b8765/databases/(default)/documents/restaurants/${restaurantId}/menuItems`);
        const json = await res.json();
        if (isMounted) {
          if (json.documents && json.documents.length > 0) {
            const loaded = json.documents.map((d) => {
              const fields = d.fields || {};
              const id = d.name.split("/").pop();
              return mapDocToItem(id, {
                name: fields.name?.stringValue,
                description: fields.description?.stringValue,
                price: fields.price?.doubleValue || parseFloat(fields.price?.integerValue || 0),
                category: fields.category?.stringValue,
                image: fields.image?.stringValue || fields.imageUrl?.stringValue,
                type: fields.type?.stringValue,
                isSpecial: fields.isSpecial?.booleanValue,
                available: fields.available?.booleanValue !== false,
              });
            });
            setMenuItems(loaded);
          } else {
            setMenuItems([]);
          }
          setLoading(false);
        }
      } catch (err) {
        console.warn("[CustomerView] REST fallback error:", err);
        if (isMounted) {
          setMenuItems([]);
          setLoading(false);
        }
      }
    };

    if (isFirebaseAvailable && db) {
      try {
        const menuColRef = collection(db, "restaurants", restaurantId, "menuItems");
        getDocs(menuColRef).then((snap) => {
          if (!isMounted) return;
          if (!snap.empty) {
            const loaded = snap.docs.map((docSnap) => mapDocToItem(docSnap.id, docSnap.data()));
            setMenuItems(loaded);
            setLoading(false);
          } else {
            fetchViaRest();
          }
        }).catch(() => fetchViaRest());

        unsubscribe = onSnapshot(
          menuColRef,
          (snapshot) => {
            if (!isMounted) return;
            const items = snapshot.docs.map((docSnap) => mapDocToItem(docSnap.id, docSnap.data()));
            setMenuItems(items);
            setLoading(false);
          },
          (err) => {
            console.warn("[CustomerView] onSnapshot error:", err);
            fetchViaRest();
          }
        );
      } catch (err) {
        console.warn("[CustomerView] init error:", err);
        fetchViaRest();
      }
    } else {
      fetchViaRest();
    }

    return () => {
      isMounted = false;
      unsubscribe();
    };
  }, [restaurantId]);

  // Real-time live order status listener via onSnapshot for activeOrderId
  useEffect(() => {
    if (!activeOrderId || !isFirebaseAvailable || !db) return;
    try {
      const orderRef = doc(db, "restaurants", restaurantId, "orders", activeOrderId);
      const unsubOrder = onSnapshot(orderRef, (docSnap) => {
        if (docSnap.exists()) {
          const data = docSnap.data();
          setLiveOrderStatus({
            id: docSnap.id,
            tokenNumber: data.tokenNumber || "TB-100",
            status: (data.status || "PENDING").toUpperCase(),
          });
        }
      });
      return () => unsubOrder();
    } catch (e) {
      console.warn("Live order tracker listener error:", e);
    }
  }, [activeOrderId, restaurantId]);

  const categories = ["All", "Veg", "Non-Veg", "Mains", "Snacks"];

  const filteredItems = useMemo(() => {
    return menuItems.filter((item) => {
      if (item.available === false) return false;

      const matchSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                          item.description.toLowerCase().includes(searchQuery.toLowerCase());
      
      let matchCategory = true;
      if (selectedCategory === "All") {
        matchCategory = true;
      } else if (selectedCategory === "Veg") {
        matchCategory = item.isVegetarian === true;
      } else if (selectedCategory === "Non-Veg") {
        matchCategory = item.isVegetarian === false;
      } else {
        matchCategory = item.category === selectedCategory;
      }

      return matchCategory && matchSearch;
    });
  }, [menuItems, selectedCategory, searchQuery]);

  const cartItemCount = cart.reduce((sum, item) => sum + item.qty, 0);
  const cartSubtotal = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
  const taxAmount = cartSubtotal * 0.05;
  const grandTotal = cartSubtotal + taxAmount;

  const addToCart = (item) => {
    setCart((prev) => {
      const existing = prev.find((i) => i.id === item.id);
      if (existing) {
        return prev.map((i) => (i.id === item.id ? { ...i, qty: i.qty + 1 } : i));
      }
      return [...prev, { ...item, qty: 1 }];
    });
  };

  const updateCartQty = (id, delta) => {
    setCart((prev) => {
      return prev.map((i) => {
        if (i.id === id) {
          const newQty = i.qty + delta;
          return newQty > 0 ? { ...i, qty: newQty } : null;
        }
        return i;
      }).filter(Boolean);
    });
  };

  const handlePlaceOrder = async () => {
    if (cart.length === 0 || isOrderSubmitting) return;
    setIsOrderSubmitting(true);

    const tokenNumber = "TB-" + Math.floor(100 + Math.random() * 900);
    const orderPayload = {
      tokenNumber,
      tableNumber: tableNumber || 1,
      items: cart.map((i) => ({ id: i.id, name: i.name, price: i.price, qty: i.qty })),
      totalAmount: grandTotal,
      specialInstructions: specialInstructions.trim(),
      status: "PENDING",
      createdAt: new Date().toISOString(),
      timestamp: Date.now(),
    };

    let orderId = "ord_" + Date.now();

    if (isFirebaseAvailable && db) {
      try {
        const ordersCol = collection(db, "restaurants", restaurantId, "orders");
        const docRef = await addDoc(ordersCol, orderPayload);
        orderId = docRef.id;
      } catch (err) {
        console.warn("Firestore order add error:", err);
      }
    }

    const finalOrder = { id: orderId, ...orderPayload };
    setPlacedOrder(finalOrder);
    setActiveOrderId(orderId);
    setLiveOrderStatus({ id: orderId, tokenNumber, status: "PENDING" });
    setIsOrderSubmitting(false);
    setIsCartOpen(false);
    setShowSuccessModal(true);
    setCart([]);
    setSpecialInstructions("");
  };

  return React.createElement(
    "div",
    { className: "min-h-screen bg-stone-50 pb-28" },
    React.createElement(
      "header",
      { className: "bg-white border-b border-stone-200 sticky top-0 z-30 shadow-xs" },
      React.createElement(
        "div",
        { className: "max-w-4xl mx-auto px-4 py-3.5 flex justify-between items-center" },
        React.createElement(
          "div",
          { className: "flex items-center gap-3" },
          React.createElement(
            "div",
            { className: "w-10 h-10 rounded-2xl bg-amber-600 text-white flex items-center justify-center font-black text-lg shadow-sm" },
            restaurant.name ? restaurant.name.charAt(0) : "S"
          ),
          React.createElement(
            "div",
            null,
            React.createElement("h1", { className: "font-black text-base text-stone-900 leading-tight" }, restaurant.name),
            React.createElement(
              "div",
              { className: "flex items-center gap-2 text-xs text-stone-500 mt-0.5" },
              React.createElement("span", { className: "font-bold text-amber-700 bg-amber-50 px-2 py-0.5 rounded-full border border-amber-200/60" }, `Table ${tableNumber}`),
              React.createElement("span", null, "•"),
              React.createElement("span", { className: "truncate max-w-[180px]" }, restaurant.tagline || "Digital QR Menu")
            )
          )
        ),
        React.createElement(
          "button",
          {
            type: "button",
            onClick: onStaffLogin,
            className: "shrink-0 px-3 py-2 rounded-xl bg-stone-900 text-white text-xs font-bold shadow-sm hover:bg-stone-700"
          },
          "Staff Login"
        )
      )
    ),

    liveOrderStatus && React.createElement(
      "div",
      { className: "max-w-4xl mx-auto px-4 pt-4" },
      React.createElement(
        "div",
        { className: "bg-stone-900 text-white rounded-3xl p-4 md:p-5 shadow-xl border border-amber-500/40 flex items-center justify-between gap-4" },
        React.createElement(
          "div",
          { className: "flex items-center gap-3" },
          React.createElement(
            "div",
            { className: "w-10 h-10 rounded-2xl bg-amber-500/20 border border-amber-400/40 text-amber-400 flex items-center justify-center font-black text-lg shrink-0" },
            "📡"
          ),
          React.createElement(
            "div",
            null,
            React.createElement("div", { className: "text-[10px] uppercase font-black tracking-widest text-amber-400" }, `Live Order Tracker • ${liveOrderStatus.tokenNumber}`),
            React.createElement(
              "div",
              { className: "text-sm font-black flex items-center gap-2 mt-0.5" },
              liveOrderStatus.status === "PENDING" && React.createElement("span", { className: "text-red-400 flex items-center gap-1.5" }, React.createElement("span", { className: "w-2.5 h-2.5 rounded-full bg-red-500 animate-ping" }), "🔴 Order Received (Pending KOT)"),
              liveOrderStatus.status === "PREPARING" && React.createElement("span", { className: "text-amber-300 flex items-center gap-1.5" }, React.createElement("span", { className: "w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse" }), "🟡 Cooking in Kitchen (Preparing)"),
              liveOrderStatus.status === "COMPLETED" && React.createElement("span", { className: "text-emerald-400 flex items-center gap-1.5" }, React.createElement("span", { className: "w-2.5 h-2.5 rounded-full bg-emerald-500" }), "🟢 Served / Completed")
            )
          )
        ),
        React.createElement(
          "button",
          {
            onClick: () => setLiveOrderStatus(null),
            className: "text-xs bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-xl font-bold transition-colors shrink-0"
          },
          "Dismiss"
        )
      )
    ),

    React.createElement(
      "div",
      { className: "max-w-4xl mx-auto px-4 pt-4" },
      React.createElement(
        "div",
        { className: "bg-gradient-to-r from-stone-900 via-stone-800 to-amber-950 rounded-3xl p-6 text-white shadow-xl relative overflow-hidden flex flex-col md:flex-row items-center justify-between gap-6" },
        React.createElement(
          "div",
          { className: "space-y-2 z-10 text-center md:text-left" },
          React.createElement("span", { className: "bg-amber-500/20 border border-amber-400/40 text-amber-300 text-[10px] font-black uppercase tracking-widest px-3 py-1 rounded-full" }, "Contactless QR Dining"),
          React.createElement("h2", { className: "text-2xl md:text-3xl font-black tracking-tight" }, "Scan, Order & Enjoy!"),
          React.createElement("p", { className: "text-xs text-stone-300 max-w-md leading-relaxed" }, "Browse our chef-crafted menu, customize your order, and send it directly to the kitchen in real-time.")
        ),
        React.createElement(
          "div",
          { className: "bg-white/10 backdrop-blur-md p-4 rounded-2xl border border-white/20 text-center z-10 shrink-0" },
          React.createElement("span", { className: "text-[10px] text-amber-300 uppercase tracking-widest font-bold block" }, "Seated at"),
          React.createElement("span", { className: "text-2xl font-black font-mono text-white block mt-0.5" }, `Table ${tableNumber}`)
        )
      )
    ),

    React.createElement(
      "div",
      { className: "max-w-4xl mx-auto px-4 mt-6 space-y-4" },
      React.createElement(
        "div",
        { className: "flex flex-col sm:flex-row gap-3 items-center justify-between" },
        React.createElement(
          "div",
          { className: "relative w-full sm:w-72" },
          React.createElement("span", { className: "absolute left-3.5 top-3 text-stone-400 text-sm" }, "🔍"),
          React.createElement("input", {
            type: "text",
            placeholder: "Search dishes, drinks...",
            value: searchQuery,
            onChange: (e) => setSearchQuery(e.target.value),
            className: "w-full pl-10 pr-4 py-2.5 bg-white border border-stone-200 rounded-2xl text-xs font-medium focus:outline-none focus:ring-2 focus:ring-amber-600 shadow-xs"
          })

    if (navigator && navigator.clipboard) {

    }
    setCopiedField(fieldName);
    setTimeout(() => setCopiedField(null), 2500);
  };

  const handleDeleteRestaurant = async (restId, restName) => {
    if (!window.confirm(`Are you sure you want to permanently delete "${restName}" (${restId})?`)) return;
    
    setRestaurants((prev) => prev.filter((r) => r.id !== restId));

    if (isFirebaseAvailable && db) {
      try {
        await deleteDoc(doc(db, "restaurants", restId));
      } catch (err) {
        console.warn("[SuperAdmin] Failed to delete restaurant from Firestore:", err);
      }
    }
  };

  const handleChangePin = async (restId, restName) => {
    const newOwnerPin = String(Math.floor(100000 + Math.random() * 900000));
    let newKitchenPin = String(Math.floor(100000 + Math.random() * 900000));
    while (newKitchenPin === newOwnerPin) {
      newKitchenPin = String(Math.floor(100000 + Math.random() * 900000));
    }

    setRestaurants((prev) =>
      prev.map((r) => (r.id === restId ? { ...r, ownerPin: newOwnerPin, kitchenPin: newKitchenPin } : r))
    );

    if (isFirebaseAvailable && db) {
      try {
        await updateDoc(doc(db, "restaurants", restId), {
          ownerPin: newOwnerPin,
          kitchenPin: newKitchenPin,
        });
      } catch (err) {
        console.warn("[SuperAdmin] Failed to update PINs in Firestore:", err);
      }
    }

    alert(`New PINs generated for ${restName}:\nOwner PIN: ${newOwnerPin}\nKitchen PIN: ${newKitchenPin}`);

    const newStatus = currentStatus === "ACTIVE" ? "EXPIRED" : "ACTIVE";

function PinLoginModal({ restaurants, defaultRestId, onSuccess, onCancel }) {
  const [pin, setPin] = useState("");
  const [error, setError] = useState("");

  const handleDigit = (digit) => {
    if (pin.length < 6) {
      setPin((prev) => prev + digit);
      setError("");
    }
  };

  const handleDelete = () => {
    setPin((prev) => prev.slice(0, -1));
    setError("");
  };

  const handleLogin = (e) => {
    if (e) e.preventDefault();
    if (pin === "999999") {
      onSuccess({ role: "admin" });
      return;
    }

    const currentRest = restaurants.find((r) => r.id === defaultRestId);
    if (currentRest) {
      if (currentRest.ownerPin === pin) {
        onSuccess({ role: "owner", restaurantId: currentRest.id });
        return;
      }
      if (currentRest.kitchenPin === pin) {
        onSuccess({ role: "kitchen", restaurantId: currentRest.id });
        return;
      }
    }

    const ownerRest = restaurants.find((r) => r.ownerPin === pin);
    if (ownerRest) {
      onSuccess({ role: "owner", restaurantId: ownerRest.id });
      return;
    }

    const kitchenRest = restaurants.find((r) => r.kitchenPin === pin);
    if (kitchenRest) {
      onSuccess({ role: "kitchen", restaurantId: kitchenRest.id });
      return;
    }

    if (pin === "111111") {
      onSuccess({ role: "owner", restaurantId: "rest-101" });
      return;
    }
    if (pin === "222222") {
      onSuccess({ role: "kitchen", restaurantId: "rest-101" });
      return;
    }

    setError("Invalid Staff PIN code");
  };

  return React.createElement(
    "div",
    { className: "fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4 font-sans" },
    React.createElement(
      "div",
      { className: "bg-white rounded-3xl p-6 w-full max-w-xs shadow-2xl text-center space-y-4" },
      React.createElement(
        "div",
        { className: "flex justify-between items-center" },
        React.createElement("span", { className: "text-xl" }, "🔐"),
        React.createElement("button", { onClick: onCancel, className: "text-stone-400 hover:text-stone-600 text-sm font-bold" }, "✕")
      ),
      React.createElement(
        "div",
        null,
        React.createElement("h2", { className: "text-lg font-black text-stone-900" }, "Staff & Admin Access"),
        React.createElement("p", { className: "text-xs text-stone-500" }, "Enter 6-digit role PIN")
      ),
      React.createElement(
        "div",
        { className: "flex justify-center gap-2 my-2" },
        [0, 1, 2, 3, 4, 5].map((i) =>
          React.createElement(
            "div",
            {
              key: i,
              className: `w-9 h-11 rounded-xl border flex items-center justify-center font-bold text-lg font-mono ${
                pin[i] ? "border-amber-600 bg-amber-50 text-amber-900" : "border-stone-200 bg-stone-50"
              }`
            },
            pin[i] ? "•" : ""
          )
        )
      ),
      error && React.createElement("p", { className: "text-xs text-red-600 font-bold" }, error),
      React.createElement(
        "div",
        { className: "grid grid-cols-3 gap-2 pt-2" },
        [1, 2, 3, 4, 5, 6, 7, 8, 9].map((num) =>
          React.createElement(
            "button",
            {
              key: num,
              onClick: () => handleDigit(num.toString()),
              className: "py-3 rounded-xl bg-stone-50 hover:bg-stone-100 text-stone-800 font-bold text-lg transition-colors border border-stone-200"
            },
            num
          )
        ),
        React.createElement("button", { onClick: () => setPin(""), className: "py-3 rounded-xl bg-stone-50 hover:bg-stone-100 text-stone-400 font-bold text-xs" }, "Clear"),
        React.createElement("button", { onClick: () => handleDigit("0"), className: "py-3 rounded-xl bg-stone-50 hover:bg-stone-100 text-stone-800 font-bold text-lg border border-stone-200" }, "0"),
        React.createElement("button", { onClick: handleDelete, className: "py-3 rounded-xl bg-stone-50 hover:bg-stone-100 text-stone-600 font-bold text-sm" }, "⌫")
      ),
      React.createElement(
        "button",
        {
          onClick: handleLogin,
          disabled: pin.length < 6,
          className: "w-full py-3 bg-amber-600 hover:bg-amber-700 disabled:bg-stone-300 text-white rounded-xl font-bold text-sm transition-all shadow-xs"
        },
        "Verify PIN"
      )
    )
  );
}

        }))
      ),
      React.createElement(

        { id: "printable-qr-stand", className: "bg-gradient-to-b from-stone-900 via-stone-900 to-black p-5 rounded-2xl text-center text-white shadow-xl border border-stone-800 space-y-3" },
        React.createElement(

          React.createElement("div", { className: "inline-block px-4 py-0.5 rounded-full bg-amber-500/20 border border-amber-400/40 text-amber-300 font-black text-sm uppercase tracking-wider" }, `TABLE ${activeTable}`)
        ),
        React.createElement(

          { className: "bg-white p-3 rounded-2xl w-44 h-44 mx-auto shadow-md flex items-center justify-center" },
          React.createElement("img", { src: qrCodeImageUrl, alt: `QR Code for Table ${activeTable}`, className: "w-full h-full object-contain" })
        ),
        React.createElement(
          "div",
          { className: "space-y-0.5 text-xs" },
          React.createElement("p", { className: "font-bold text-stone-200 flex items-center justify-center gap-1.5" }, React.createElement("span", null, "📷"), React.createElement("span", null, "Point phone camera to scan menu")),
          React.createElement("p", { className: "text-[10px] text-stone-400" }, "No app needed • Order & Pay from your table")
        )
      ),
      React.createElement(
