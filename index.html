<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101528"><title>SJ Restaurant</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/images/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="accent"></div>
<section id="loginScreen"><div class="login-wrap">
  <div class="brand">SJ<small>DIGITAL LABS</small></div><h1>SJ Restaurant</h1><p class="sub">Login to manage your restaurant</p>
  <form class="login-card" id="loginForm">
    <label class="label" for="restaurantName">Restaurant Name</label><input class="field" id="restaurantName" placeholder="Enter your restaurant name" autocomplete="organization" required>
    <label class="label" for="pin">PIN / Password</label><input class="field" id="pin" type="password" minlength="4" placeholder="Enter PIN or password" required>
    <button class="primary" type="submit">Login&nbsp; →</button><p class="note">Demo interface · Backend authentication not connected</p>
  </form>
</div></section>
<section id="mainScreen" class="hidden">
<header class="topbar"><button class="icon" id="menuBtn">☰</button><div class="mini">SJ</div><div class="topname" id="topName">My Restaurant</div><button class="icon" id="themeBtn">☾</button><button class="icon logout" id="logoutBtn">⇥</button></header>
<div class="layout"><aside class="sidebar" id="desktopNav"></aside><main class="content"><div id="pageContent"></div></main></div>
<nav class="bottom" id="bottomNav"><button class="active" data-page="dashboard"><b>⌂</b>Home</button><button data-page="orders"><b>▤</b>Orders</button><button data-page="tables"><b>▦</b>Tables</button><button data-page="menu"><b>☷</b>Menu</button></nav>
</section>
<div class="overlay hidden" id="overlay"></div><aside class="drawer" id="drawer"><div class="drawerhead"><span>SJ Restaurant</span><button class="icon" id="closeDrawer">×</button></div><div id="drawerNav"></div></aside><div class="toast hidden" id="toast"></div>
<script src="assets/js/app.js" defer></script>
</body></html>
